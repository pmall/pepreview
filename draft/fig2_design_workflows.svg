<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 454" width="1000" height="454" role="img" aria-labelledby="fig2-title fig2-desc">
  <title id="fig2-title">Three Binder-Design Workflows</title>
  <desc id="fig2-desc">Three horizontal binder-design workflows aligned on a three-column grid: binder initialization (3D noise cloud, masked binder, or L by 20 soft sequence), full-width design workflow (decoupled structure generation and inverse folding, single-step joint all-atom diffusion, or gradient optimization through a frozen predictor), converging on 3D binder plus sequence, candidate filtering, and wet-lab assays.</desc>

  <defs>
    <style>
      text {
        font-family: 'Geist', 'Hiragino Sans', 'Yu Gothic', system-ui, -apple-system, sans-serif;
      }
      .mono {
        font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;
      }
    </style>
    <marker id="arr-fwd" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.2 L 9 5 L 0 8.8 Z" fill="#17323A"/>
    </marker>
    <marker id="arr-grad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.2 L 9 5 L 0 8.8 Z" fill="#7A5195"/>
    </marker>
  </defs>

  <!-- Column headers -->
  <text x="104" y="24" font-size="11" font-weight="600" letter-spacing="1.1" fill="#4D6A74" text-anchor="middle">BINDER INPUT</text>
  <text x="490" y="24" font-size="11" font-weight="600" letter-spacing="1.1" fill="#4D6A74" text-anchor="middle">DESIGN WORKFLOW (CONDITIONED ON TARGET)</text>
  <text x="888" y="24" font-size="11" font-weight="600" letter-spacing="1.1" fill="#4D6A74" text-anchor="middle">OUTPUT &amp; SELECTION</text>

  <!-- ========================================================= -->
  <!-- ROW 1: GENERATE-AND-FILTER (y=62..148, h=86)              -->
  <!-- ========================================================= -->
  <text x="16" y="52" font-size="12" font-weight="700" letter-spacing="0.4" fill="#17323A">1. GENERATE-AND-FILTER</text>
  <text x="756" y="52" font-size="11" fill="#4D6A74" text-anchor="end">Decoupled · Structure first, then sequence</text>

  <!-- Col 1 Row 1: Atom Cloud (x=16..192, w=176) -->
  <rect x="16" y="62" width="176" height="86" rx="6" fill="#FFFFFF" stroke="#17323A" stroke-width="1.4"/>
  <g transform="translate(28, 75)">
    <circle cx="28" cy="28" r="24" fill="#F5F7F7" stroke="#D3DFDF" stroke-width="1.2" stroke-dasharray="3 2"/>
    <circle cx="17" cy="18" r="2.6" fill="#0D7372" opacity="0.7"/>
    <circle cx="30" cy="12" r="2.4" fill="#4D6A74"/>
    <circle cx="42" cy="19" r="2.6" fill="#0D7372"/>
    <circle cx="14" cy="30" r="2.4" fill="#4D6A74" opacity="0.8"/>
    <circle cx="27" cy="26" r="2.8" fill="#0D7372"/>
    <circle cx="38" cy="31" r="2.6" fill="#4D6A74"/>
    <circle cx="20" cy="40" r="2.4" fill="#0D7372" opacity="0.75"/>
    <circle cx="34" cy="41" r="2.6" fill="#0D7372" opacity="0.85"/>
    <circle cx="26" cy="46" r="2.2" fill="#4D6A74" opacity="0.65"/>
  </g>
  <text x="94" y="96" font-size="13" font-weight="600" fill="#17323A">Atom Cloud</text>
  <text x="94" y="114" font-size="11" fill="#4D6A74">3D noise only</text>
  <text x="94" y="130" font-size="10.5" fill="#4D6A74">No sequence</text>

  <line x1="192" y1="105" x2="218" y2="105" stroke="#17323A" stroke-width="2" marker-end="url(#arr-fwd)"/>

  <!-- Col 2 Row 1 (spans exact x=224..756, w=532) -->
  <!-- Step 1A: Structure Generator -->
  <rect x="224" y="62" width="144" height="86" rx="6" fill="#FFFFFF" stroke="#0D7372" stroke-width="1.6"/>
  <rect x="224" y="62" width="5" height="86" rx="2" fill="#0D7372"/>
  <text x="298" y="95" font-size="13.5" font-weight="600" fill="#17323A" text-anchor="middle">Structure</text>
  <text x="298" y="112" font-size="13.5" font-weight="600" fill="#17323A" text-anchor="middle">Generator</text>
  <text x="298" y="132" font-size="10.5" fill="#4D6A74" text-anchor="middle">Denoise 3D binder</text>

  <line x1="368" y1="105" x2="390" y2="105" stroke="#17323A" stroke-width="2" marker-end="url(#arr-fwd)"/>

  <!-- Intermediate: 3D Binder Only -->
  <rect x="396" y="62" width="188" height="86" rx="6" fill="#F5F7F7" stroke="#17323A" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="490" y="81" font-size="11.5" font-weight="600" fill="#17323A" text-anchor="middle">3D Binder Only</text>
  <path d="M 412 114 C 420 94, 436 92, 446 105 C 455 117, 469 113, 476 97" fill="none" stroke="#0D7372" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="412" cy="114" r="2.4" fill="#17323A"/>
  <circle cx="446" cy="105" r="2.4" fill="#17323A"/>
  <circle cx="476" cy="97" r="2.4" fill="#17323A"/>
  <g transform="translate(490, 96)">
    <rect x="0" y="0" width="17" height="18" rx="2.5" fill="#FFFFFF" stroke="#4D6A74" stroke-width="1" stroke-dasharray="2.5 1.5"/>
    <text x="8.5" y="12.5" class="mono" font-size="9.5" fill="#4D6A74" text-anchor="middle">?</text>
    <rect x="21" y="0" width="17" height="18" rx="2.5" fill="#FFFFFF" stroke="#4D6A74" stroke-width="1" stroke-dasharray="2.5 1.5"/>
    <text x="29.5" y="12.5" class="mono" font-size="9.5" fill="#4D6A74" text-anchor="middle">?</text>
    <rect x="42" y="0" width="17" height="18" rx="2.5" fill="#FFFFFF" stroke="#4D6A74" stroke-width="1" stroke-dasharray="2.5 1.5"/>
    <text x="50.5" y="12.5" class="mono" font-size="9.5" fill="#4D6A74" text-anchor="middle">?</text>
    <rect x="63" y="0" width="17" height="18" rx="2.5" fill="#FFFFFF" stroke="#4D6A74" stroke-width="1" stroke-dasharray="2.5 1.5"/>
    <text x="71.5" y="12.5" class="mono" font-size="9.5" fill="#4D6A74" text-anchor="middle">?</text>
  </g>
  <text x="490" y="136" font-size="10" fill="#4D6A74" text-anchor="middle">Atoms / backbone · No sequence</text>

  <line x1="584" y1="105" x2="606" y2="105" stroke="#17323A" stroke-width="2" marker-end="url(#arr-fwd)"/>

  <!-- Step 1B: Inverse Folding -->
  <rect x="612" y="62" width="144" height="86" rx="6" fill="#FFFFFF" stroke="#0D7372" stroke-width="1.6"/>
  <rect x="612" y="62" width="5" height="86" rx="2" fill="#0D7372"/>
  <text x="686" y="95" font-size="13.5" font-weight="600" fill="#17323A" text-anchor="middle">Inverse</text>
  <text x="686" y="112" font-size="13.5" font-weight="600" fill="#17323A" text-anchor="middle">Folding</text>
  <text x="686" y="132" font-size="10.5" fill="#4D6A74" text-anchor="middle">Assign AA sequence</text>

  <line x1="756" y1="105" x2="774" y2="105" stroke="#17323A" stroke-width="2"/>

  <!-- ========================================================= -->
  <!-- ROW 2: UNIFIED ALL-ATOM CO-DESIGN (y=186..272, h=86)      -->
  <!-- ========================================================= -->
  <text x="16" y="176" font-size="12" font-weight="700" letter-spacing="0.4" fill="#17323A">2. UNIFIED ALL-ATOM CO-DESIGN</text>
  <text x="756" y="176" font-size="11" fill="#4D6A74" text-anchor="end">Single model · Atoms and sequence generated together</text>

  <!-- Col 1 Row 2: Masked Binder (x=16..192, w=176) -->
  <rect x="16" y="186" width="176" height="86" rx="6" fill="#FFFFFF" stroke="#17323A" stroke-width="1.4"/>
  <text x="104" y="205" font-size="12" font-weight="600" fill="#17323A" text-anchor="middle">Masked Binder</text>
  <g transform="translate(26, 212)">
    <circle cx="20" cy="20" r="18" fill="#F5F7F7" stroke="#D3DFDF" stroke-width="1.1" stroke-dasharray="3 2"/>
    <circle cx="12" cy="14" r="2.2" fill="#0D7372" opacity="0.7"/>
    <circle cx="23" cy="11" r="2.1" fill="#4D6A74"/>
    <circle cx="30" cy="19" r="2.2" fill="#0D7372"/>
    <circle cx="14" cy="26" r="2.1" fill="#4D6A74"/>
    <circle cx="24" cy="25" r="2.3" fill="#0D7372" opacity="0.85"/>
    <circle cx="20" cy="33" r="2" fill="#4D6A74"/>
  </g>
  <text x="76" y="236" font-size="12" font-weight="700" fill="#4D6A74" text-anchor="middle">+</text>
  <g transform="translate(88, 223)">
    <rect x="0" y="0" width="20" height="19" rx="2.5" fill="#F5F7F7" stroke="#4D6A74" stroke-width="1.1" stroke-dasharray="2.5 1.5"/>
    <text x="10" y="13" class="mono" font-size="10" font-weight="600" fill="#4D6A74" text-anchor="middle">?</text>
    <rect x="23" y="0" width="20" height="19" rx="2.5" fill="#F5F7F7" stroke="#4D6A74" stroke-width="1.1" stroke-dasharray="2.5 1.5"/>
    <text x="33" y="13" class="mono" font-size="10" font-weight="600" fill="#4D6A74" text-anchor="middle">?</text>
    <rect x="46" y="0" width="20" height="19" rx="2.5" fill="#F5F7F7" stroke="#4D6A74" stroke-width="1.1" stroke-dasharray="2.5 1.5"/>
    <text x="56" y="13" class="mono" font-size="10" font-weight="600" fill="#4D6A74" text-anchor="middle">?</text>
    <rect x="69" y="0" width="20" height="19" rx="2.5" fill="#F5F7F7" stroke="#4D6A74" stroke-width="1.1" stroke-dasharray="2.5 1.5"/>
    <text x="79" y="13" class="mono" font-size="10" font-weight="600" fill="#4D6A74" text-anchor="middle">?</text>
  </g>
  <text x="104" y="263" font-size="10" fill="#4D6A74" text-anchor="middle">Noise atoms + masked seq</text>

  <line x1="192" y1="229" x2="218" y2="229" stroke="#17323A" stroke-width="2" marker-end="url(#arr-fwd)"/>

  <!-- Col 2 Row 2: FULL WIDTH Joint All-Atom Diffusion (consistent teal main accent) -->
  <rect x="224" y="186" width="532" height="86" rx="6" fill="#FFFFFF" stroke="#0D7372" stroke-width="1.6"/>
  <rect x="224" y="186" width="5" height="86" rx="2" fill="#0D7372"/>
  <text x="493" y="220" font-size="15.5" font-weight="600" fill="#17323A" text-anchor="middle">Joint All-Atom Diffusion Network</text>
  <text x="493" y="242" font-size="11.5" fill="#4D6A74" text-anchor="middle">Generates 3D coordinates and amino-acid sequence simultaneously in one step</text>

  <line x1="756" y1="229" x2="774" y2="229" stroke="#17323A" stroke-width="2"/>

  <!-- ========================================================= -->
  <!-- ROW 3: GRADIENT-BASED OPTIMIZATION (y=310..396, h=86)     -->
  <!-- ========================================================= -->
  <text x="16" y="300" font-size="12" font-weight="700" letter-spacing="0.4" fill="#17323A">3. GRADIENT-BASED OPTIMIZATION</text>
  <text x="756" y="300" font-size="11" fill="#4D6A74" text-anchor="end">Model inversion · Full differentiability down to sequence</text>

  <!-- Col 1 Row 3: Soft Sequence L x 20 (x=16..192, w=176) -->
  <rect x="16" y="310" width="176" height="86" rx="6" fill="#FFFFFF" stroke="#17323A" stroke-width="1.4"/>
  <text x="104" y="328" font-size="12" font-weight="600" fill="#17323A" text-anchor="middle">Soft Sequence (L × 20)</text>
  <g transform="translate(30, 335)">
    <rect x="0" y="0" width="148" height="44" rx="4" fill="#F5F7F7" stroke="#D3DFDF" stroke-width="1"/>
    <text x="6" y="13" class="mono" font-size="8" fill="#4D6A74">1</text>
    <rect x="16" y="6" width="14" height="8" rx="1.5" fill="#0D7372" opacity="0.25"/>
    <rect x="33" y="6" width="14" height="8" rx="1.5" fill="#0D7372" opacity="0.9"/>
    <rect x="50" y="6" width="14" height="8" rx="1.5" fill="#0D7372" opacity="0.35"/>
    <rect x="67" y="6" width="14" height="8" rx="1.5" fill="#0D7372" opacity="0.2"/>
    <rect x="84" y="6" width="14" height="8" rx="1.5" fill="#0D7372" opacity="0.45"/>
    <rect x="101" y="6" width="14" height="8" rx="1.5" fill="#0D7372" opacity="0.18"/>
    <text x="122" y="13" class="mono" font-size="8" fill="#4D6A74">…20</text>
    <text x="6" y="25" class="mono" font-size="8" fill="#4D6A74">2</text>
    <rect x="16" y="18" width="14" height="8" rx="1.5" fill="#0D7372" opacity="0.85"/>
    <rect x="33" y="18" width="14" height="8" rx="1.5" fill="#0D7372" opacity="0.2"/>
    <rect x="50" y="18" width="14" height="8" rx="1.5" fill="#0D7372" opacity="0.3"/>
    <rect x="67" y="18" width="14" height="8" rx="1.5" fill="#0D7372" opacity="0.5"/>
    <rect x="84" y="18" width="14" height="8" rx="1.5" fill="#0D7372" opacity="0.2"/>
    <rect x="101" y="18" width="14" height="8" rx="1.5" fill="#0D7372" opacity="0.25"/>
    <text x="122" y="25" class="mono" font-size="8" fill="#4D6A74">…20</text>
    <text x="6" y="37" class="mono" font-size="8" fill="#4D6A74">L</text>
    <rect x="16" y="30" width="14" height="8" rx="1.5" fill="#0D7372" opacity="0.2"/>
    <rect x="33" y="30" width="14" height="8" rx="1.5" fill="#0D7372" opacity="0.3"/>
    <rect x="50" y="30" width="14" height="8" rx="1.5" fill="#0D7372" opacity="0.9"/>
    <rect x="67" y="30" width="14" height="8" rx="1.5" fill="#0D7372" opacity="0.2"/>
    <rect x="84" y="30" width="14" height="8" rx="1.5" fill="#0D7372" opacity="0.35"/>
    <rect x="101" y="30" width="14" height="8" rx="1.5" fill="#0D7372" opacity="0.18"/>
    <text x="122" y="37" class="mono" font-size="8" fill="#4D6A74">…20</text>
  </g>
  <text x="104" y="390" font-size="9.5" fill="#4D6A74" text-anchor="middle">L distributions over 20 AAs</text>

  <line x1="192" y1="353" x2="218" y2="353" stroke="#17323A" stroke-width="2" marker-end="url(#arr-fwd)"/>

  <!-- Col 2 Row 3: Frozen Predictor + Design Loss (uniform teal workflow cards) -->
  <rect x="224" y="310" width="262" height="86" rx="6" fill="#FFFFFF" stroke="#0D7372" stroke-width="1.6"/>
  <rect x="224" y="310" width="5" height="86" rx="2" fill="#0D7372"/>
  <text x="357" y="340" font-size="14.5" font-weight="600" fill="#17323A" text-anchor="middle">Frozen Structure Predictor</text>
  <text x="357" y="360" font-size="11.5" fill="#4D6A74" text-anchor="middle">Fixed prediction weights</text>
  <text x="357" y="381" class="mono" font-size="10" fill="#4D6A74" text-anchor="middle">IPA · Distogram · Few-step ODE</text>

  <line x1="486" y1="353" x2="514" y2="353" stroke="#17323A" stroke-width="2" marker-end="url(#arr-fwd)"/>

  <rect x="520" y="310" width="236" height="86" rx="6" fill="#FFFFFF" stroke="#7A5195" stroke-width="1.6"/>
  <rect x="520" y="310" width="5" height="86" rx="2" fill="#7A5195"/>
  <text x="640" y="341" font-size="14.5" font-weight="600" fill="#17323A" text-anchor="middle">Design Loss</text>
  <text x="640" y="361" font-size="11.5" fill="#4D6A74" text-anchor="middle">Folding + interface contacts</text>
  <text x="640" y="380" font-size="11" fill="#4D6A74" text-anchor="middle">Optional LM prior / discrete moves</text>

  <line x1="756" y1="353" x2="774" y2="353" stroke="#17323A" stroke-width="2"/>

  <!-- Collector rail merging all 3 workflows before Column 3 -->
  <line x1="774" y1="105" x2="774" y2="353" stroke="#17323A" stroke-width="2"/>

  <!-- Gradient feedback loop underneath Row 3 (purple secondary accent) -->
  <path d="M 638 396 V 428 H 104 V 402" fill="none" stroke="#7A5195" stroke-width="2" stroke-dasharray="5 3" stroke-linejoin="round" marker-end="url(#arr-grad)"/>
  <rect x="234" y="417" width="274" height="22" rx="11" fill="#7A5195"/>
  <text x="371" y="432" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">∇ Backpropagate gradients to update L × 20</text>

  <!-- ========================================================= -->
  <!-- COL 3: SHARED OUTPUT, FILTERING & WET LAB (x=792..984)    -->
  <!-- ========================================================= -->
  <rect x="792" y="62" width="192" height="334" rx="8" fill="#E3EBEB" stroke="#D3DFDF" stroke-width="1.2"/>

  <!-- Single merged arrow entering 3D Binder + Sequence card cleanly along y=105 -->
  <line x1="774" y1="105" x2="798" y2="105" stroke="#17323A" stroke-width="2" marker-end="url(#arr-fwd)"/>

  <!-- Card 1: 3D Binder + Sequence -->
  <rect x="804" y="74" width="168" height="90" rx="6" fill="#FFFFFF" stroke="#17323A" stroke-width="1.4"/>
  <text x="888" y="94" font-size="12.5" font-weight="600" fill="#17323A" text-anchor="middle">3D Binder + Sequence</text>
  <path d="M 818 124 C 824 108, 836 106, 844 116 C 851 125, 861 122, 867 110" fill="none" stroke="#0D7372" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="818" cy="124" r="2.2" fill="#17323A"/>
  <circle cx="844" cy="116" r="2.2" fill="#17323A"/>
  <circle cx="867" cy="110" r="2.2" fill="#17323A"/>
  <g transform="translate(876, 108)">
    <rect x="0" y="0" width="15" height="17" rx="2.5" fill="#0D7372"/>
    <text x="7.5" y="12" class="mono" font-size="8.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">M</text>
    <rect x="18" y="0" width="15" height="17" rx="2.5" fill="#4D6A74"/>
    <text x="25.5" y="12" class="mono" font-size="8.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">A</text>
    <rect x="36" y="0" width="15" height="17" rx="2.5" fill="#7A5195"/>
    <text x="43.5" y="12" class="mono" font-size="8.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">K</text>
    <rect x="54" y="0" width="15" height="17" rx="2.5" fill="#0D7372"/>
    <text x="61.5" y="12" class="mono" font-size="8.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">L</text>
    <rect x="72" y="0" width="15" height="17" rx="2.5" fill="#4D6A74"/>
    <text x="79.5" y="12" class="mono" font-size="8.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">V</text>
  </g>
  <text x="888" y="150" font-size="10" fill="#4D6A74" text-anchor="middle">Bound complex + sequence</text>

  <line x1="888" y1="164" x2="888" y2="188" stroke="#17323A" stroke-width="2" marker-end="url(#arr-fwd)"/>

  <!-- Card 2: Candidate Filtering (purple secondary accent matching scoring/selection) -->
  <rect x="804" y="194" width="168" height="84" rx="6" fill="#FFFFFF" stroke="#7A5195" stroke-width="1.6"/>
  <rect x="804" y="194" width="5" height="84" rx="2" fill="#7A5195"/>
  <text x="888" y="216" font-size="12.5" font-weight="600" fill="#17323A" text-anchor="middle">Candidate Filtering</text>
  <text x="888" y="234" font-size="10.5" fill="#4D6A74" text-anchor="middle">Refolding confidence</text>
  <text x="888" y="249" class="mono" font-size="9.5" fill="#4D6A74" text-anchor="middle">pLDDT · ipTM · ipSAE</text>
  <text x="888" y="266" font-size="10.5" fill="#4D6A74" text-anchor="middle">or binding classifier</text>

  <line x1="888" y1="278" x2="888" y2="302" stroke="#17323A" stroke-width="2" marker-end="url(#arr-fwd)"/>

  <!-- Card 3: Wet-Lab Assays -->
  <rect x="804" y="308" width="168" height="76" rx="6" fill="#123B3F"/>
  <text x="888" y="333" font-size="13.5" font-weight="700" fill="#F2F7F6" text-anchor="middle">Wet-Lab Assays</text>
  <text x="888" y="352" font-size="10.5" font-weight="600" fill="#C2A14D" text-anchor="middle">Tens of designs / target</text>
  <text x="888" y="370" class="mono" font-size="9.5" fill="#E3EBEB" text-anchor="middle">SPR · BLI · Display</text>
</svg>
